name: MovieExplorer
options:
  bundleIdPrefix: pe.isil.pa3
  deploymentTarget:
    iOS: "17.0"
targets:
  MovieExplorer:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa3.movieexplorer
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: MovieExplorer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  MovieExplorerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MovieExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa3.movieexplorer.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MovieExplorer:
    build:
      targets:
        MovieExplorer: all
    test:
      targets:
        - MovieExplorerUITests
