name: EventPlanner
options:
  bundleIdPrefix: pe.isil.pa3
  deploymentTarget:
    iOS: "17.0"
targets:
  EventPlanner:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa3.eventplanner
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: EventPlanner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  EventPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: EventPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa3.eventplanner.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EventPlanner:
    build:
      targets:
        EventPlanner: all
    test:
      targets:
        - EventPlannerUITests
